<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <defs><radialGradient id="bg" cx="0.72" cy="0.3" r="0.95">
<stop offset="0" stop-color="#E2E2E2"/><stop offset="0.6" stop-color="#DCDCDC"/><stop offset="1" stop-color="#D0D0D0"/></radialGradient></defs>
