    </g>
    <g transform="translate(785,1092) scale(1.43) translate(-710,-845)">
    <!-- Professionnel: briefcase -->
    <circle cx="710" cy="845" r="46" fill="#FCFCFC" stroke="#1D1D1B"/>
    <path d="M700,831 v-6 a4,4 0 0 1 4,-4 h12 a4,4 0 0 1 4,4 v6" fill="none" stroke="#1D1D1B" stroke-width="5"/>
